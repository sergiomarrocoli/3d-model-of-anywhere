<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>civil-war</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161a; color: #e6e6e6; font: 14px/1.4 system-ui, sans-serif; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; top: 8px; left: 12px; text-shadow: 0 0 4px #000; }
    #players { position: fixed; top: 8px; right: 12px; text-align: right; text-shadow: 0 0 4px #000; font-size: 12px; max-width: 45vw; }
    #players .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: baseline; }
    #players button { font: inherit; font-size: 11px; margin-left: 6px; }
    #credits { position: fixed; bottom: 6px; left: 12px; right: 12px; font-size: 11px; opacity: .8; text-shadow: 0 0 4px #000; }
    a { color: #8ab4f8; margin-right: 8px; } a.on { color: #fff; font-weight: 700; }
    body.flow #scene, body.flow #hud, body.flow #credits { display: none; }
    body.debug #scene { display: none; } body.debug #hud { position: static; margin: 16px; }
    pre { background: #1d2026; padding: 12px; border-radius: 6px; overflow: auto; margin: 0 16px; }
    .row[hidden] { display: none; } .row { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px; } canvas.dbg { max-width: 100%; image-rendering: pixelated; border: 1px solid #333; }
  </style>
</head>
<body>
  <div id="flow" hidden></div>
  <canvas id="scene"></canvas>
  <div id="hud"><div id="areas"></div></div>
  <div id="players" hidden></div>
  <div id="credits"></div>
  <pre id="summary" hidden></pre>
  <div class="row" id="dbgrow" hidden><canvas id="imagery" class="dbg"></canvas><canvas id="height" class="dbg"></canvas></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
